name: CI

# Checks every PR and every push to dev/main/next. Make "CI / check" a required
# status check on dev and main so nothing lands without passing it.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [dev, main, next]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changelog:
    name: changelog
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Fetch PR base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch --no-tags origin "$BASE_SHA"
      - name: Require a change note
        run: node scripts/check-changelog.mjs
      # Run the release compile on every pending note, so a broken one fails
      # here instead of at release time.
      - name: Validate change notes
        run: |
          if ls changes/*.md | grep -qv README.md; then
            node scripts/compile-changelog.mjs --version 999.0.0 --summary "CI check" --dry-run > /dev/null
          fi
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm exec biome ci .
      - name: Typecheck
        run: pnpm exec tsc -b
      - name: Tests
        run: pnpm run test:all
      - name: Build
        run: pnpm run build
