name: Build desktop app

# Release tags build and publish. Branch builds are on demand via workflow_dispatch,
# since pushing dev, main and a tag together used to queue three full matrices
# against GitHub's macOS runner limit.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

jobs:
  validate-release:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify tag and manifest versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/validate-release-version.mjs --tag "${{ github.ref_name }}"
      # Create the release up front so the first matrix job to finish doesn't have to.
      # tauri-action's create-then-upload path silently failed the Windows job in v0.10.1.
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          gh release view "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Spicy Lyrics TTML Tool ${{ github.ref_name }}" \
              --notes "Desktop release ${{ github.ref_name }}. Release notes are finalized after all platform assets are uploaded."
        env:
          GH_TOKEN: ${{ github.token }}

  prepare-release-notes:
    name: Prepare release notes
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.notes.outputs.source }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: notes
        name: Convert matching app changelog entry
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if node scripts/generate-release-notes.mjs \
            --version "$version" \
            --output "$RUNNER_TEMP/release-notes.md"; then
            echo "source=changelog" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No readable changelog entry exists for v$version; GitHub-generated release notes will be used."
            echo "source=github" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload converted release notes
        if: startsWith(github.ref, 'refs/tags/v') && steps.notes.outputs.source == 'changelog'
        uses: actions/upload-artifact@v6
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  build-tauri-desktop:
    name: Build ${{ matrix.name }} (${{ matrix.arch }})
    needs: [validate-release, prepare-release-notes]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: ""
            name: linux
            arch: x86_64
          - platform: windows-latest
            args: ""
            name: windows
            arch: x86_64
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            name: macOS
            arch: aarch64
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            name: macOS
            arch: x86_64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          # The macOS jobs share a runner OS, so without this they restore each other's target dir.
          key: ${{ matrix.name }}-${{ matrix.arch }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Install LLVM and Clang on macOS
        if: matrix.platform == 'macos-latest'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "15"
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libappindicator3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Build release and publish immutable tagged release
        id: release
        if: startsWith(github.ref, 'refs/tags/v')
        # hdiutil intermittently fails DMG packaging on GitHub's macOS runners; retry once below.
        continue-on-error: ${{ matrix.platform == 'macos-latest' }}
        uses: tauri-apps/tauri-action@v0
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Spicy Lyrics TTML Tool ${{ github.ref_name }}
          releaseBody: Desktop release ${{ github.ref_name }}. Release notes are finalized after all platform assets are uploaded.
          includeUpdaterJson: true
          # Installed apps read the generic windows-x86_64 entry; point it at setup.exe (see lib.rs).
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Retry tagged release build
        if: steps.release.outcome == 'failure'
        uses: tauri-apps/tauri-action@v0
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Spicy Lyrics TTML Tool ${{ github.ref_name }}
          releaseBody: Desktop release ${{ github.ref_name }}. Release notes are finalized after all platform assets are uploaded.
          includeUpdaterJson: true
          # Installed apps read the generic windows-x86_64 entry; point it at setup.exe (see lib.rs).
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Build branch artifact
        if: "!startsWith(github.ref, 'refs/tags/v')"
        shell: bash
        run: pnpm tauri build ${{ matrix.args }} || { [ "$RUNNER_OS" = macOS ] && pnpm tauri build ${{ matrix.args }}; }
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Install AppImage repacking tool
        if: matrix.platform == 'ubuntu-latest'
        shell: bash
        # Pinned: the rolling "continuous" build changed under us and broke v0.19.0.
        run: |
          curl --fail --location --retry 3 \
            --output /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /usr/local/bin/appimagetool" | sha256sum --check
          chmod +x /usr/local/bin/appimagetool
      - name: Remove host-incompatible libraries from AppImage
        if: matrix.platform == 'ubuntu-latest'
        shell: bash
        run: |
          appimage_path=$(find src-tauri/target -path '*/release/bundle/appimage/*.AppImage' -type f -print -quit)
          test -n "$appimage_path"
          bash scripts/patch-appimage.sh "$appimage_path"
      - name: Replace published Linux AppImage
        if: matrix.platform == 'ubuntu-latest' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          appimage_path=$(find src-tauri/target -path '*/release/bundle/appimage/*.AppImage' -type f -print -quit)
          test -n "$appimage_path"
          for asset in $(gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name | select(endswith(".AppImage"))'); do
            gh release delete-asset "${{ github.ref_name }}" "$asset" --yes || true
          done
          gh release upload "${{ github.ref_name }}" "$appimage_path" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v6
        with:
          name: Spicy Lyrics TTML Tool ${{ matrix.name }}-${{ matrix.arch }}
          path: |
            src-tauri/target/**/release/bundle/**/*
            src-tauri/target/**/release/amll-ttml-tool.exe
            src-tauri/target/**/release/amll-ttml-tool

  # The main Linux package. Wraps the Linux binary from the matrix in the GNOME
  # runtime, so WebKitGTK, GStreamer and GLib match on every distro.
  build-flatpak:
    name: Build Flatpak (x86_64)
    needs: build-tauri-desktop
    # Only the Linux binary is needed, so a failed macOS leg must not skip this.
    if: ${{ !cancelled() && needs.build-tauri-desktop.result != 'skipped' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: Spicy Lyrics TTML Tool linux-x86_64
          path: linux-build
      - name: Place the Linux binary where the manifest expects it
        shell: bash
        # Not any other copy: the AppImage's AppDir one has been rewritten by
        # patchelf, and stripping that left a binary with no program headers.
        run: install -Dm755 linux-build/release/amll-ttml-tool src-tauri/target/release/amll-ttml-tool
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.spicylyrics.TTMLTool.yml
          bundle: Spicy-Lyrics-TTML-Tool_x86_64.flatpak
          artifact-name: Spicy Lyrics TTML Tool flatpak-x86_64
          cache-key: flatpak-builder-${{ github.sha }}

  finalize-release:
    name: Finalize release notes
    # A failed Flatpak only leaves it off the release; notes and Winget still go out.
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.build-tauri-desktop.result == 'success' && needs.prepare-release-notes.result == 'success' }}
    needs: [build-tauri-desktop, build-flatpak, prepare-release-notes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        if: needs.build-flatpak.result == 'success'
        with:
          name: Spicy Lyrics TTML Tool flatpak-x86_64
          path: flatpak
      - name: Upload Flatpak bundle
        if: needs.build-flatpak.result == 'success'
        run: gh release upload "${{ github.ref_name }}" flatpak/*.flatpak --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v7
        if: needs.prepare-release-notes.outputs.source == 'changelog'
        with:
          name: release-notes
          path: release-notes
      - name: Set changelog-derived release notes
        if: needs.prepare-release-notes.outputs.source == 'changelog'
        run: gh release edit "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" --title "Spicy Lyrics TTML Tool ${{ github.ref_name }}" --notes-file release-notes/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Generate fallback release notes
        if: needs.prepare-release-notes.outputs.source != 'changelog'
        shell: bash
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="${{ github.ref_name }}" --jq .body > release-notes.md
          gh release edit "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" \
            --title "Spicy Lyrics TTML Tool ${{ github.ref_name }}" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}

  submit-winget:
    name: Submit Winget manifest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: finalize-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Require Winget publishing token
        env:
          WINGET_PKGS_TOKEN: ${{ secrets.WINGET_PKGS_TOKEN }}
        run: test -n "$WINGET_PKGS_TOKEN"
      - name: Get permanent x64 MSI asset
        id: installer
        shell: bash
        run: |
          gh release download "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" \
            --pattern '*x64*.msi' --dir release-assets
          installer_path=$(find release-assets -maxdepth 1 -type f -name '*x64*.msi' | head -n 1)
          test -n "$installer_path"
          installer_name=$(basename "$installer_path")
          installer_url="https://github.com/$GITHUB_REPOSITORY/releases/download/${{ github.ref_name }}/$installer_name"
          echo "url=$installer_url" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$installer_path" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check out the Winget fork
        uses: actions/checkout@v6
        with:
          repository: TheX24/winget-pkgs
          ref: master
          path: winget-pkgs
          token: ${{ secrets.WINGET_PKGS_TOKEN }}
      - name: Generate manifests
        shell: bash
        run: node scripts/generate-winget-manifests.mjs --version "${GITHUB_REF_NAME#v}" --installer-url "${{ steps.installer.outputs.url }}" --installer-sha256 "${{ steps.installer.outputs.sha256 }}" --output winget-pkgs
      - name: Validate generated manifests
        shell: bash
        run: node scripts/validate-winget-manifests.mjs --version "${GITHUB_REF_NAME#v}" --output winget-pkgs
      - name: Push manifests and open or update upstream PR
        shell: bash
        working-directory: winget-pkgs
        run: |
          version="${GITHUB_REF_NAME#v}"
          branch="amll-ttml-tool/$version"
          git config user.name "TheX24 release bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add manifests/n/NaeNaeTart/AMLLTTMLTool/"$version"
          git commit -m "New version: NaeNaeTart.AMLLTTMLTool version $version" || true
          git push --force origin "$branch"
          if ! gh pr list --repo microsoft/winget-pkgs --head "TheX24:$branch" --state open --json url --jq '.[0].url' | grep -q .; then
            gh pr create --repo microsoft/winget-pkgs --head "TheX24:$branch" --base master \
              --title "New version: NaeNaeTart.AMLLTTMLTool version $version" \
              --body "Automated manifest submission for AMLL TTML Tool $version."
          fi
        env:
          GH_TOKEN: ${{ secrets.WINGET_PKGS_TOKEN }}
