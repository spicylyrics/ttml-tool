[package]
name = "amll-ttml-tool"
version = "0.20.1"
description = "A word-by-word TTML lyrics editor and timing tool for Spicy Lyrics"
license = "AGPL-3.0"
repository = "https://github.com/spicylyrics/ttml-tool"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "amll_ttml_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
discord-rich-presence = "1.1.0"
tauri = { version = "2.9.5", features = ["devtools", "protocol-asset"] }
tao = "0.34"
tauri-plugin-log = "2.8.0"
window-vibrancy = "0.7"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
tauri-plugin-decorum = "1"
tauri-plugin-process = "2.3.1"
# Portal backend so Linux shows the desktop's own file picker (zenity fallback).
tauri-plugin-dialog = { version = "~2", default-features = false, features = ["xdg-portal"] }
tauri-plugin-fs = "~2.4.5"
tauri-plugin-persisted-scope = "2"
# Renders the recolored logo for the window and shortcut icons. No text support needed.
resvg = { version = "0.49", default-features = false }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.9.0"
tauri-plugin-window-state = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
